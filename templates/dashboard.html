{% extends "base.html" %}
{% block title %}Dashboard • CampusFit

<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Fire Mode logic
    const streak = parseInt('{{ streak }}') || 0;
    if (streak >= 3) {
      document.body.style.setProperty('--accent', '#ff4500');
      document.body.style.setProperty('--accent-glow', 'rgba(255, 69, 0, 0.4)');
      document.body.style.setProperty('--blue', '#ff8c00');
      const brand = document.querySelector('.brand');
      if (brand && !brand.innerHTML.includes('On Fire')) {
        brand.innerHTML += ' <span style="font-size:16px;">?? On Fire!</span>';
      }
    }

    // Heatmap generation
    const heatmapContainer = document.getElementById('cyber-heatmap');
    if (heatmapContainer) {
      heatmapContainer.innerHTML = ''; // clear any existing
      for (let i = 0; i < 98; i++) {
        const box = document.createElement('div');
        box.className = 'heat-box';
        const isRecent = i > 70;
        const isActive = Math.random() < (isRecent ? 0.7 : 0.2);
        
        if (isActive) {
          const intensity = Math.floor(Math.random() * 3) + 1;
          box.classList.add('level-' + intensity);
        }
        heatmapContainer.appendChild(box);
      }
    }
    
    // Rings Animation
    setTimeout(() => {
      document.querySelectorAll('.ring-circle-progress').forEach(ring => {
        const percent = ring.getAttribute('data-percent');
        if (percent !== null) {
          const circumference = parseFloat(ring.getAttribute('stroke-dasharray'));
          const offset = circumference - (percent / 100) * circumference;
          ring.style.strokeDashoffset = offset;
        }
      });
    }, 300);
  });
</script>
<style>
  /* Heatmap Styles */
  .heat-box {
    width: 14px;
    height: 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    transition: all 0.2s;
  }
  .heat-box:hover {
    transform: scale(1.3);
    box-shadow: 0 0 8px var(--accent);
    z-index: 10;
  }
  .heat-box.level-1 { background: rgba(34, 211, 238, 0.3); }
  .heat-box.level-2 { background: rgba(34, 211, 238, 0.6); box-shadow: 0 0 6px rgba(34, 211, 238, 0.4); }
  .heat-box.level-3 { background: rgba(34, 211, 238, 1); box-shadow: 0 0 10px rgba(34, 211, 238, 0.7); }
</style>

{% endblock %}
